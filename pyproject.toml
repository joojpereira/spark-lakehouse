[project]
name = "spark-lakehouse"
version = "0.1.0"
description = "Apache Spark com Delta Lake e Apache Iceberg - Trabalho de Pesquisa Arquitetura de Dados"
requires-python = ">=3.11"

dependencies = [
    "pyspark==3.5.1",
    "delta-spark==3.2.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notebooks"]
